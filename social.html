  <style>
    .social-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      padding: 48px 24px;
    }
    .social-header { text-align: center; }
    .social-heading {
      font-size: 56px;
      font-weight: 800;
      color: #2a2e35;
      letter-spacing: -0.01em;
    }
    .social-sub {
      margin-top: 8px;
      font-size: 20px;
      color: #6b707a;
      position: relative;
      padding-top: 14px;
    }
    .social-sub::before {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 160px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #5fa8e6, transparent);
    }
    .social-grid {
      display: flex;
      gap: 80px;
      align-items: center;
      justify-content: center;
      margin-top: 40px;
      flex-wrap: wrap;
    }
    .social-tile {
      width: 160px;
      height: 160px;
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 4px 10px rgba(0, 0, 0, 0.15),
        0 12px 24px -8px rgba(0, 0, 0, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.4);
      transition: transform 220ms var(--ease-menu), box-shadow 220ms ease-out;
      text-decoration: none;
      position: relative;
      overflow: hidden;
    }
    .social-tile::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.35) 0%, transparent 50%);
      pointer-events: none;
    }
    @media (hover: hover) and (pointer: fine) {
      .social-tile:hover {
        transform: translateY(-10px) scale(1.1);
        box-shadow:
          0 8px 18px rgba(0, 0, 0, 0.22),
          0 24px 40px -8px rgba(0, 0, 0, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.5);
      }
    }
    .social-tile:active { transform: scale(0.95); }
    .social-tile:focus-visible {
      transform: translateY(-10px) scale(1.1);
      box-shadow:
        0 8px 18px rgba(0, 0, 0, 0.22),
        0 24px 40px -8px rgba(0, 0, 0, 0.28),
        inset 0 1px 0 rgba(255, 255, 255, 0.5);
      outline: none;
    }
    .social-tile svg {
      width: 60%;
      height: 60%;
      color: #fff;
      z-index: 1;
    }
    .social-label {
      margin-top: 14px;
      font-size: 16px;
      font-weight: 600;
      color: #2a2e35;
      text-align: center;
      letter-spacing: 0.01em;
    }
    .social-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .tile--twitter  { background: linear-gradient(180deg, #1da1f2 0%, #0a7cc9 100%); }
    .tile--linkedin { background: linear-gradient(180deg, #2a86c0 0%, #0a66c2 100%); }
    .tile--github   { background: linear-gradient(180deg, #3a3f47 0%, #1a1d22 100%); }
    .tile--substack { background: linear-gradient(180deg, #ff8a4c 0%, #ff6719 100%); }

    /* Entrance: tiles cascade up, matching the site's card-entrance language. */
    .social-item {
      animation: tile-in 300ms var(--ease-out-strong) both;
    }
    .social-item:nth-child(1) { animation-delay: 0ms; }
    .social-item:nth-child(2) { animation-delay: 40ms; }
    .social-item:nth-child(3) { animation-delay: 80ms; }
    .social-item:nth-child(4) { animation-delay: 120ms; }
    @keyframes tile-in {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
    }
    @media (prefers-reduced-motion: reduce) {
      .social-item { animation: none; }
    }

    /* Mobile: 2x2 tile grid, smaller heading. */
    @media (max-width: 700px) {
      .social-panel { padding: 24px 16px; gap: 20px; }
      .social-heading { font-size: 34px; }
      .social-sub { font-size: 16px; }
      .social-grid { gap: 28px 36px; margin-top: 12px; }
      .social-tile { width: 118px; height: 118px; border-radius: 22px; }
      .social-label { font-size: 14px; margin-top: 10px; }
    }
  </style>

  <script>
    // Pre-paint scale + arrival flash — mirrors scripts/scale.js applyScale
    // (constants must stay in sync). Runs inline so the first painted frame is
    // already at the correct zoom, and so pages arrive from the same white the
    // previous page flashed out to — content is fully painted under the
    // overlay from frame 1, with zero dependence on CDN script latency.
    (function () {
      var mobile = window.matchMedia("(max-width: 700px)").matches;
      var el = document.getElementById("stage") || document.querySelector(".subpage-stage");
      if (!el) return;
      var menu = el.id === "stage";
      if (!mobile) {
        var w = menu ? 985 : 1280, h = menu ? 554 : 720;
        var vh = window.innerHeight - (menu ? 100 : 0);
        var fit = Math.min(window.innerWidth / w, vh / h);
        el.style.transform = "scale(" + (menu ? fit * 1.2 : fit) + ")";
      }
      var f = document.getElementById("flash-overlay");
      if (!f) return;
      if (menu) {
        // Returning from a subpage: hold the white until the zoom-out fades it.
        var returning = false;
        try { returning = !!sessionStorage.getItem("wiiReturn"); } catch (_) {}
        if (location.search.indexOf("return=") !== -1) returning = true;
        if (returning) {
          f.style.opacity = "1";
          // Safety: if modules stall on a slow network, don't stay white.
          setTimeout(function () {
            if (getComputedStyle(f).opacity === "1") {
              f.style.transition = "opacity 300ms cubic-bezier(0.23, 1, 0.32, 1)";
              f.style.opacity = "0";
            }
          }, 2500);
        }
      } else {
        // Subpage arrival: fade in from white, symmetric with the white-out exit.
        f.style.opacity = "1";
        requestAnimationFrame(function () {
          f.style.transition = "opacity 150ms cubic-bezier(0.23, 1, 0.32, 1)";
          f.style.opacity = "0";
          setTimeout(function () { f.style.transition = ""; }, 250);
        });
      }
    })();
  </script>
