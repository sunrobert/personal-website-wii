<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="Books Robert Sun is reading and recommends." />

  <meta property="og:title" content="Books — Robert Sun" />
  <meta property="og:description" content="Books Robert Sun is reading and recommends." />
  <meta property="og:image" content="assets/avatar.jpg" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Books — Robert Sun" />
  <meta name="twitter:description" content="Books Robert Sun is reading and recommends." />
  <meta name="twitter:image" content="assets/avatar.jpg" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="stylesheet" href="styles/main.css?v=1778541907" />
  <link rel="stylesheet" href="styles/subpage.css?v=1778541907" />
  <link rel="stylesheet" href="styles/mobile.css?v=1785715000" />
  <style>
    .subpage-panel {
      background: transparent;
      box-shadow: none;
      padding: 0;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .carousel {
      width: 100%;
      overflow: hidden;
      mask-image: linear-gradient(90deg, transparent 0, #000 6%, #000 94%, transparent 100%);
      -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 6%, #000 94%, transparent 100%);
    }
    .carousel-track {
      display: flex;
      gap: 36px;
      width: max-content;
      animation: carousel-scroll 48s linear infinite;
    }
    .carousel:hover .carousel-track,
    .carousel:focus-within .carousel-track {
      animation-play-state: paused;
    }
    @keyframes carousel-scroll {
      from { transform: translateX(0); }
      to   { transform: translateX(-50%); }
    }
    .book {
      flex: 0 0 200px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .book-cover {
      width: 200px;
      aspect-ratio: 2 / 3;
      border-radius: 4px;
      box-shadow:
        0 1px 2px rgba(0,0,0,0.18),
        0 10px 22px -6px rgba(0,0,0,0.28);
      overflow: hidden;
      background: #1a1a1a;
    }
    .book-cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .book h3 {
      margin: 12px 0 2px;
      font-size: 14px;
      color: #2a2e35;
      line-height: 1.25;
      max-width: 100%;
    }
    .book .author { color: #8a8f97; font-size: 12px; }

    /* Mobile: smaller covers; center the carousel vertically in the page. */
    @media (max-width: 700px) {
      .subpage-panel { min-height: 60vh; }
      .carousel-track { gap: 22px; }
      .book { flex: 0 0 140px; }
      .book-cover { width: 140px; }
    }
  </style>
</head>
<body class="subpage">
  <div id="letterbox">
    <div class="subpage-stage">
      <div id="flash-overlay"></div>
      <header class="subpage-header">
        <img class="subpage-icon" src="assets/channels/books.png" alt="" />
        <h1 class="subpage-title">Books</h1>
      </header>
      <section class="subpage-panel">
        <div class="carousel" aria-label="Bookshelf carousel">
          <div class="carousel-track" id="carousel-track">
            <!-- Books are injected here by script (duplicated for seamless loop) -->
          </div>
        </div>
      </section>
      <button class="wii-menu-btn" data-channel-id="books">Wii Menu</button>
    </div>
  </div>
  <script>
    const BOOKS = [
      { title: "Hamlet",                                           author: "William Shakespeare",   img: "assets/books/hamlet.jpg" },
      { title: "The Prince",                                       author: "Niccolò Machiavelli",   img: "assets/books/prince.jpg" },
      { title: "Chip War",                                         author: "Chris Miller",          img: "assets/books/chip-war.jpg" },
      { title: "Meditations",                                      author: "Marcus Aurelius",       img: "assets/books/meditations.jpg" },
      { title: "Principles for Dealing with the Changing World Order", author: "Ray Dalio",         img: "assets/books/principles.jpg" },
      { title: "Tao Te Ching",                                     author: "Lao Tzu",               img: "assets/books/tao.jpg" },
      { title: "The Republic",                                     author: "Plato",                 img: "assets/books/republic.jpg" },
      { title: "The Creative Act",                                 author: "Rick Rubin",            img: "assets/books/creative-act.jpg" },
    ];
    const track = document.getElementById("carousel-track");
    const render = (b) => `
      <div class="book">
        <div class="book-cover"><img src="${b.img}" alt="${b.title}" loading="lazy" /></div>
        <h3>${b.title}</h3>
        <div class="author">${b.author}</div>
      </div>`;
    // Duplicate the list so the marquee loops seamlessly (translateX(-50%) lands exactly on second copy start)
    track.innerHTML = [...BOOKS, ...BOOKS].map(render).join("");
  </script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/howler@2.2.4/dist/howler.min.js"></script>
  <script type="module" src="scripts/subpage.js?v=1785715000"></script>
</body>
</html>
